name: meovm_lint
description: "A linter for meovm — lightweight MVVM framework for Flutter. Built-in dependencies between members, bunch of built-in members for common use cases, and minimum boilerplate approach."
version: 1.1.3
repository: https://github.com/da-cat7976/meovm
issue_tracker: https://github.com/da-cat7976/meovm/issues

resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  analyzer: ^8.4.0
  analyzer_plugin: ^0.13.4
  custom_lint_builder: ^0.8.0
  meovm_api: ^1.0.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
