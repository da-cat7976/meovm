name: meovm_gen
description: "A code generator for meovm — lightweight MVVM framework for Flutter. Built-in dependencies between members, bunch of built-in members for common use cases, and minimum boilerplate approach."
version: 1.2.2
repository: https://github.com/da-cat7976/meovm
issue_tracker: https://github.com/da-cat7976/meovm/issues

environment:
  sdk: ^3.13.0

resolution: workspace

# Add regular dependencies here.
dependencies:
  code_builder: ^4.12.0
  build: ^4.0.11
  build_config: ^1.3.3
  dart_style: ^3.1.13
  string_scanner: ^1.4.1
  analyzer: ^13.3.0
  source_span: ^1.10.2
  path: ^1.9.1
  loggy: ^2.0.3
  meovm_api: ^1.2.2
  source_gen: ^4.2.4
  collection: ^1.19.1

dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.1.0
  test: ^1.31.1
